# Run from the repo root:
#   docker compose --env-file .env -f deploy/compose.yml up -d --build
# Only the variables listed below reach the container (the rest of .env stays out).
# Host prerequisites: data/state/ and runs/ must be writable by uid 10001 (chown 10001 data/state runs).
services:
  rai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rai-hackathon
    restart: unless-stopped
    networks:
      - rai-net
    ports:
      - "127.0.0.1:17080:8000"
    environment:
      LITELLM_BASE_URL: http://172.31.250.1:14000/v1   # reaches the BA gateway through gw-forward
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set in .env}
      RAI_MODEL: ${RAI_MODEL:?set in .env}
      RAI_GRAPH: ${RAI_GRAPH:-data/graph/kg.trig}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      ICA_API_KEY: ${ICA_API_KEY:?set in .env}   # IBM ICA models for live runs (approved by the user)
      RAI_INVITE_CODES: ${RAI_INVITE_CODES:-}   # empty = live mode closed
      RAI_REVIEWER_CODES: ${RAI_REVIEWER_CODES:-}   # empty = curation writes closed (read-only demo)
      RAI_MAX_LIVE: ${RAI_MAX_LIVE:-4}      # live runs at once; further questions queue
      RAI_MAX_QUEUE: ${RAI_MAX_QUEUE:-20}   # queued questions before "live mode is full"
      RAI_RUN_LIMIT: ${RAI_RUN_LIMIT:-60}   # live runs per client IP and hour (one Wi-Fi = one IP)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 12g   # embedding the larger graph (seeds plus RAG baseline in parallel) was OOM-killed at 2g and 4g
    cpus: 2
    pids_limit: 256
    volumes:
      - ../data:/app/data:ro
      - ../data/state:/app/data/state:rw
      - ../runs:/app/runs:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      retries: 3

  # The BA gateway only listens on 127.0.0.1:14000 of the host. This forwards the bridge gateway address to it.
  # If it starts before rai-net exists, the bind fails and restart: unless-stopped retries.
  gw-forward:
    image: alpine/socat:1.8.0.3
    container_name: rai-gw-forward
    restart: unless-stopped
    network_mode: host
    user: "65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["TCP-LISTEN:14000,bind=172.31.250.1,fork,reuseaddr", "TCP:127.0.0.1:14000"]

networks:
  rai-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/28
          gateway: 172.31.250.1
